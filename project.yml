name: KoreanOutliner
options:
  bundleIdPrefix: com.naxreo
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: ko
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.naxreo.koreanoutliner
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: "Korean Outliner"

targets:
  KoreanOutliner:
    type: application
    platform: macOS
    sources:
      - path: _workspace/02_interfaces.swift
        group: Interfaces
      - path: _workspace/modules
        group: Modules
        excludes:
          - "*.md"
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        NSAccessibilityUsageDescription: "포커스된 윈도우의 위치/크기를 읽어 외곽선을 그리기 위해 Accessibility 권한이 필요합니다."
        CFBundleName: Korean Outliner
        CFBundleDisplayName: Korean Outliner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026"
    entitlements:
      path: Resources/KoreanOutliner.entitlements
      properties:
        com.apple.security.app-sandbox: false
